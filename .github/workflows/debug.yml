name: Debug
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hello
        run: echo "runner OK" && uname -a && gcc --version 2>&1 | head -1
      - uses: actions/checkout@v4
      - name: After checkout
        run: ls -la && cat safeshutdown.c | head -5
      - name: Simple compile test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc
          echo "COMPILE TEST" && gcc -O2 -Wall -Wextra -std=c11 -o /tmp/test safeshutdown.c -lpthread && echo "OK" || echo "FAILED"
