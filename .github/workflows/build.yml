name: Build & Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  amd64-glibc:
    name: "amd64 glibc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: which gcc && gcc --version | head -1
      - run: gcc -O2 -Wall -Wextra -std=c11 -o safeshutdown safeshutdown.c -lpthread 2>&1
      - run: file safeshutdown
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-amd64-glibc
          path: safeshutdown

  arm64-glibc:
    name: "arm64 glibc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - run: aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=c11 -o safeshutdown safeshutdown.c -lpthread 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-arm64-glibc
          path: safeshutdown

  amd64-musl:
    name: "amd64 musl"
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      - run: apk add --no-cache gcc musl-dev make linux-headers
      - run: gcc -O2 -Wall -Wextra -std=c11 -static -o safeshutdown safeshutdown.c -lpthread 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-amd64-musl
          path: safeshutdown

  arm64-musl:
    name: "arm64 musl"
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      - run: apk add --no-cache gcc musl-dev make linux-headers
      - run: gcc -O2 -Wall -Wextra -std=c11 -static -o safeshutdown safeshutdown.c -lpthread 2>&1
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-arm64-musl
          path: safeshutdown

  smoke-test:
    name: "冒烟测试"
    needs: [amd64-glibc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: safeshutdown-amd64-glibc
          path: .
      - run: chmod +x safeshutdown && file safeshutdown
      - run: ./safeshutdown -h
      - run: timeout 5 ./safeshutdown -d -n 2>&1 || true

  lint:
    name: "代码审查"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - run: cppcheck --enable=all --suppress=missingIncludeSystem --std=c11 safeshutdown.c 2>&1 || true
      - run: sudo apt-get install -y -qq shellcheck 2>/dev/null || true; [ -f install.sh ] && shellcheck install.sh || true
