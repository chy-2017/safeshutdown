name: Debug Compile
on: [push]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Environment info
        run: |
          echo "=== gcc ==="
          which gcc
          gcc --version 2>&1
          echo "=== kernel ==="
          uname -a
          echo "=== headers ==="
          ls /usr/include/linux/watchdog* 2>&1 || echo "no linux/watchdog.h"
          ls /usr/include/sys/ioctl.h 2>&1 || echo "no sys/ioctl.h"
          echo "=== libs ==="
          ldconfig -p | grep -i pthread | head -3

      - name: "Test: compile a minimal C program"
        run: |
          echo 'int main(){return 0;}' > /tmp/test.c
          gcc -O2 -Wall -Wextra -Werror -std=c11 -o /tmp/test /tmp/test.c -lpthread
          echo "MINIMAL COMPILE OK"

      - name: "Test: check safeshutdown.c syntax"
        run: |
          gcc -O2 -Wall -Wextra -Werror -std=c11 -fsyntax-only safeshutdown.c 2>&1 || true
          gcc -O2 -Wall -Wextra -std=c11 -fsyntax-only safeshutdown.c 2>&1

      - name: Full compile (no -Werror, capture all)
        run: |
          gcc -O2 -Wall -Wextra -std=c11 -o safeshutdown safeshutdown.c -lpthread 2>&1
          echo "FULL COMPILE OK"
          file safeshutdown

      - name: "Full compile WITH -Werror"
        run: |
          OUTPUT=$(gcc -O2 -Wall -Wextra -Werror -std=c11 -o safeshutdown safeshutdown.c -lpthread 2>&1) || {
            echo "::error::GCC WERROR FAILED: ${OUTPUT}"
            exit 1
          }
          echo "WERROR COMPILE OK"
