name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (如 v1.0.0)"
        required: true
        type: string

jobs:
  amd64-glibc:
    name: "amd64 glibc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc make
          gcc -O2 -Wall -Wextra -std=c11 -o safeshutdown safeshutdown.c -lpthread
          strip safeshutdown
      - run: |
          mkdir -p dist
          cp safeshutdown dist/safeshutdown-amd64-glibc
          cp safeshutdown.conf dist/
          cp safeshutdown.service dist/
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-amd64-glibc
          path: dist/

  i686-glibc:
    name: "i686 glibc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib
          gcc -O2 -Wall -Wextra -std=c11 -m32 -o safeshutdown safeshutdown.c -lpthread
          strip safeshutdown
      - run: |
          mkdir -p dist
          cp safeshutdown dist/safeshutdown-i686-glibc
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-i686-glibc
          path: dist/

  arm64-glibc:
    name: "arm64 glibc"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -std=c11 \
            -o safeshutdown safeshutdown.c -lpthread
          aarch64-linux-gnu-strip safeshutdown
      - run: |
          mkdir -p dist
          cp safeshutdown dist/safeshutdown-arm64-glibc
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-arm64-glibc
          path: dist/

  amd64-musl:
    name: "amd64 musl (static)"
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      - run: |
          apk add --no-cache gcc musl-dev make linux-headers
          gcc -O2 -Wall -Wextra -std=c11 -static -o safeshutdown safeshutdown.c -lpthread
          strip safeshutdown
      - run: |
          mkdir -p dist
          cp safeshutdown dist/safeshutdown-amd64-musl
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-amd64-musl
          path: dist/

  arm64-musl:
    name: "arm64 musl (static)"
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v7
      - run: |
          apk add --no-cache gcc musl-dev make linux-headers
          gcc -O2 -Wall -Wextra -std=c11 -static -o safeshutdown safeshutdown.c -lpthread
          strip safeshutdown
      - run: |
          mkdir -p dist
          cp safeshutdown dist/safeshutdown-arm64-musl
      - uses: actions/upload-artifact@v7
        with:
          name: safeshutdown-arm64-musl
          path: dist/

  create-release:
    name: "打包 Release"
    needs: [amd64-glibc, i686-glibc, arm64-glibc, amd64-musl, arm64-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理发布包
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          mkdir -p release

          # 每个架构一个子目录
          for d in artifacts/*/; do
            name="$(basename "$d")"
            mkdir -p "release/safeshutdown-$name"
            cp -r "$d"/* "release/safeshutdown-$name/"
          done

          # 生成说明文件
          cat > release/README.txt << READMEND
          ========================================
          safeshutdown — 系统安全监护程序
          版本: ${VERSION}
          ========================================

          包含架构：
            amd64-glibc   — x86_64, GNU libc (通用)
            i686-glibc    — 32位 x86, GNU libc
            arm64-glibc   — ARM64/AArch64, GNU libc
            amd64-musl    — x86_64, musl libc (静态, 便携)
            arm64-musl    — ARM64, musl libc (静态, 便携)

          安装：
            1. 根据架构选择对应目录
            2. sudo cp safeshutdown-<arch> /usr/local/sbin/safeshutdown
            3. sudo cp safeshutdown.conf /etc/safeshutdown.conf
            4. sudo cp safeshutdown.service /etc/systemd/system/
            5. sudo systemctl enable --now safeshutdown
          READMEND

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "safeshutdown ${{ github.event.inputs.version || github.ref_name }}"
          body_path: release/README.txt
          files: release/**
          draft: false
          prerelease: false
