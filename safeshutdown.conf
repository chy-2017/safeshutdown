# safeshutdown.conf - 系统安全监护程序配置文件
# 配置文件位于 /etc/safeshutdown.conf
# 格式: key = value

# =============================================================
# 基本设置
# =============================================================

# 检查间隔（毫秒），默认 2000（2秒）
# 建议：1000-5000，越短响应越快但 CPU 消耗略高
check_interval_ms = 2000

# 看门狗超时（秒），仅在有 /dev/watchdog 时有效
# 默认 20 秒
watchdog_timeout_sec = 20

# 心跳超时（秒），子进程检测主进程是否卡死
# 如果超过此时间主进程未更新心跳，子进程将执行紧急关机
heartbeat_timeout_sec = 10

# 关机宽限期（秒），紧急关机前的等待时间，让同步完成
# 从 CRITICAL 到实际关机约 6~9 秒
grace_period_sec = 15


# =============================================================
# 内存阈值
# =============================================================

# 临界：可用内存 ≤ 此百分比时触发 CRITICAL 级别关机
# 默认 8%（对于 4GB 即 320MB），触发后约 6 秒自动升级到关机
mem_critical_pct = 8

# 警告：可用内存 ≤ 此百分比时触发 WARNING 级别
# 默认 15%
mem_warning_pct = 15


# =============================================================
# PSI 内存压力阈值（压力停滞信息，Linux 4.20+）
# =============================================================

# PSI 临界值：avg10 > 此值触发 CRITICAL（百分比）
# 调低到 50%，更早感知压力
psi_mem_critical = 50

# PSI 警告值：avg10 > 此值触发 WARNING（百分比）
psi_mem_warning = 30


# =============================================================
# CPU 负载阈值
# =============================================================

# CPU 临界：load_average / CPU核心数 > 此值触发 CRITICAL
# 例如 5 意味着平均每个核心有 5 个进程在等待
cpu_load_critical = 5

# CPU 警告：load_average / CPU核心数 > 此值触发 WARNING
cpu_load_warning = 3


# =============================================================
# OOM 检测
# =============================================================

# OOM kill 阈值：一个检查周期内发生 OOM kill 的次数 ≥ 此值触发 EMERGENCY
oom_kill_threshold = 1


# =============================================================
# IO 压力阈值
# =============================================================

# IO 临界：PSI IO full avg10 > 此值触发 CRITICAL
# 调低到 80%，更早响应 IO 阻塞
psi_io_critical = 80


# =============================================================
# 行为设置
# =============================================================

# dry_run = true 时仅记录日志，不实际关机（用于测试）
dry_run = false

# 是否允许使用 Magic SysRq（终极重启手段）
use_sysrq = true
